name: Build and Release

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      artifact: ${{ steps.version.outputs.artifact }}

    steps:
      - name: Checkout source and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve build version
        id: version
        shell: pwsh
        run: ./.github/scripts/Get-BuildVersion.ps1

      - name: Publish and verify EXE
        shell: pwsh
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
          ASSEMBLY_VERSION: ${{ steps.version.outputs.assembly_version }}
          FILE_VERSION: ${{ steps.version.outputs.file_version }}
          INFORMATIONAL_VERSION: ${{ steps.version.outputs.informational_version }}
        run: |
          dotnet publish AshClicker.csproj -c Release -o publish -p:ContinuousIntegrationBuild=true `
            "-p:Version=$env:BUILD_VERSION" "-p:AssemblyVersion=$env:ASSEMBLY_VERSION" `
            "-p:FileVersion=$env:FILE_VERSION" "-p:InformationalVersion=$env:INFORMATIONAL_VERSION" `
            -p:IncludeSourceRevisionInInformationalVersion=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $exe = Get-Item -LiteralPath 'publish/AshClicker.exe'
          if ($exe.VersionInfo.FileVersion -cne $env:FILE_VERSION -or
              $exe.VersionInfo.ProductVersion -cne $env:INFORMATIONAL_VERSION) {
            throw "Unexpected EXE version: $($exe.VersionInfo.FileVersion), $($exe.VersionInfo.ProductVersion)"
          }

          $filename = "AshClicker-v$env:BUILD_VERSION.exe"
          Rename-Item -LiteralPath $exe.FullName -NewName $filename
          $hash = (Get-FileHash -LiteralPath "publish/$filename" -Algorithm SHA256).Hash
          "SHA256  $hash  $filename" | Set-Content -LiteralPath 'publish/fingerprint.txt' -Encoding ascii

      - name: Upload EXE and fingerprint
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: |
            publish/AshClicker-v${{ steps.version.outputs.version }}.exe
            publish/fingerprint.txt
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified build
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BUILD_VERSION: ${{ needs.build.outputs.version }}
          IS_PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          $filename = "AshClicker-v$env:BUILD_VERSION.exe"
          $releaseArgs = @(
            $env:GITHUB_REF_NAME
            $filename
            'fingerprint.txt'
            '--verify-tag'
            '--title', "Release $env:GITHUB_REF_NAME"
            '--notes', "SHA-256 fingerprint is included in fingerprint.txt. Verify with: certutil -hashfile $filename SHA256"
          )
          if ($env:IS_PRERELEASE -eq 'true') {
            $releaseArgs += '--prerelease'
          }
          gh release create @releaseArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
